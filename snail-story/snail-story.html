<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Snail's Tale — Beat 1: Home</title>
<style>
  /* ============================================================
     PALETTE  (warm, soft, Florence-inspired)
     ============================================================ */
  :root{
    --sky-top:#FBE6D2;
    --sky-bot:#F6D2AE;
    --sun:#FCEFD0;

    --foliage-far:#CBD8A2;
    --foliage-mid:#A9C381;
    --foliage-near:#8FB36A;

    --ground-top:#ECCFA4;
    --ground-bot:#E0B888;

    --rock-base:#C9A98B;
    --rock-shade:#B8967A;
    --rock-light:#D8BDA0;
    --moss-a:#94B36A;
    --moss-b:#A9C77F;

    --ink:#5A4632;        /* warm "almost-black" for tiny details — never pure #000 */
    --cream:#FBEAC9;
  }

  html,body{height:100%;margin:0;}
  body{
    /* deep warm frame so the square scene pops out of the letterbox */
    background:#271E17;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Stage is a SQUARE, centered, sized to the smaller window dimension.
     The SVG inside shows the central square crop of the 1200x800 layout
     (viewBox "200 0 800 800"), slice-filling the square edge-to-edge.
     Overlays below live INSIDE the stage so they clip to the square. */
  #stage{
    position:fixed;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(100vw,100vh);
    height:min(100vw,100vh);
    overflow:hidden;
    border-radius:6px;
    box-shadow:0 24px 80px rgba(0,0,0,.4);
  }
  #scene{width:100%;height:100%;display:block;}

  /* Soft vignette + warm light, sits above the scene, ignores clicks. */
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 32% 26%, rgba(255,247,228,.28), rgba(255,247,228,0) 45%),
      radial-gradient(130% 120% at 50% 58%, rgba(0,0,0,0) 55%, rgba(90,70,50,.16) 100%);
    mix-blend-mode:multiply;opacity:.9;
  }
  /* The "multiply" vignette above would darken; use a second additive glow layer. */
  #glow{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 45% at 34% 24%, rgba(255,246,222,.35), rgba(255,246,222,0) 60%);
  }

  /* Subtle beat caption, fades in near the end. */
  #caption{
    position:absolute;left:0;right:0;bottom:7%;text-align:center;
    color:var(--ink);opacity:0;pointer-events:none;
    font-size:clamp(15px,2.4vw,26px);letter-spacing:.55em;
    text-transform:lowercase;font-weight:500;
    text-indent:.55em; /* compensate trailing letter-spacing for true centering */
  }

  /* Replay control — quiet by default, brightens on hover. For clean screen-records. */
  #replay{
    position:fixed;right:18px;bottom:16px;
    display:flex;align-items:center;gap:8px;
    background:rgba(251,234,201,.55);color:var(--ink);
    border:1px solid rgba(90,70,50,.18);
    padding:9px 14px;border-radius:999px;
    font-size:13px;letter-spacing:.06em;cursor:pointer;
    opacity:.45;transition:opacity .3s ease, transform .2s ease, background .3s ease;
    backdrop-filter:blur(3px);
  }
  #replay:hover{opacity:1;background:rgba(251,234,201,.85);}
  #replay:active{transform:scale(.96);}
  #replay svg{width:14px;height:14px;}

  /* ============================================================
     ANIMATION KEYFRAMES
     Motion is slow + tender. Everything eases gently in/out.
     CSS handles: intro reveals + endless idle "life".
     JS (rAF) handles: the protagonist's path crawl.
     ============================================================ */

  /* Generic reveal: fade up + tiny scale settle. */
  @keyframes popIn{
    from{opacity:0;transform:translateY(16px) scale(.92);}
    to  {opacity:1;transform:translateY(0)    scale(1);}
  }
  /* Backdrop "settle in": slow fade + ease of scale. */
  @keyframes settleIn{
    from{opacity:0;transform:scale(1.05);}
    to  {opacity:1;transform:scale(1);}
  }
  /* Leaf drifts in from upper-right and rotates to rest. */
  @keyframes leafIn{
    0%  {opacity:0;transform:translate(230px,-180px) rotate(34deg);}
    55% {opacity:1;}
    100%{opacity:1;transform:translate(0,0) rotate(0deg);}
  }
  /* Protagonist simply fades up as the crawl begins (position is rAF-driven). */
  @keyframes fadeUp{
    from{opacity:0;}
    to  {opacity:1;}
  }

  /* Idle "alive" motions — applied to the .idle wrapper so they never
     fight the position transform (which lives on the parent .pos group). */
  @keyframes breathe{
    0%,100%{transform:scale(1,1);}
    50%    {transform:scale(1.035,.965);}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%    {transform:translateY(-3px);}
  }
  @keyframes sway{
    0%,100%{transform:rotate(-1.4deg);}
    50%    {transform:rotate(1.4deg);}
  }
  @keyframes floatMote{
    0%  {transform:translate(0,0);opacity:0;}
    15% {opacity:.7;}
    85% {opacity:.5;}
    100%{transform:translate(var(--dx),var(--dy));opacity:0;}
  }

  /* transform-origin defaults to (0,0) in SVG user space; since every
     asset's art is drawn centered on its own origin, scale/rotate idle
     motions pivot around the asset's center automatically. */

  @media (prefers-reduced-motion: reduce){
    .idle{animation:none !important;}
  }
</style>
</head>
<body>
  <div id="stage">
    <svg id="scene" viewBox="200 0 800 800" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="A calm woodland scene: a mossy rock with snails and small creatures; an amber-shelled snail crawls along a fallen leaf."></svg>
    <div id="glow"></div>
    <div id="vignette"></div>
    <div id="caption">home</div>
  </div>

  <button id="replay" title="Replay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
    </svg>
    replay
  </button>

<script>
/* ==================================================================
   A SNAIL'S TALE — Beat 1: "Home"
   Single-file interactive story opening. No frameworks, no build.
   ------------------------------------------------------------------

   ┌──────────────────────────────────────────────────────────────┐
   │  ASSET REGISTRY  — the single source of truth for the scene.   │
   │                                                                │
   │  Every visual element is one object in ASSETS[] below.         │
   │  Fields:                                                       │
   │    id        unique string                                     │
   │    type      which placeholder art to draw (see DRAW table)    │
   │    layer     integer; higher = nearer the camera (z-order).    │
   │              Assets are grouped into per-layer <g> containers,  │
   │              which is what makes parallax possible later.       │
   │    x, y      position of the asset's ANCHOR, in 1200x800 units. │
   │    w, h      on-screen size in those same units.                │
   │    anchor    {ax,ay} in 0..1 of the art box. {0.5,0.5}=center.  │
   │              Protagonist uses a low anchor so its "foot" rides  │
   │              the crawl path.                                    │
   │    rot       resting rotation in degrees (optional).            │
   │    src       null  -> draw the code placeholder (DRAW[type]).   │
   │              "path/to/img.png" -> draw that PNG instead, at the │
   │              exact same x/y/w/h/anchor. Transparency supported. │
   │    opts      art-specific options (e.g. snail colors).          │
   │    intro     'pop' | 'settle' | 'leaf' | 'fade' | 'none'        │
   │    delay     ms before the intro reveal plays.                  │
   │    idle      'breathe' | 'bob' | 'sway' | null  (endless life)  │
   │    idleDur   seconds for one idle cycle (varied = natural)      │
   │    idleDelay seconds offset so creatures don't pulse in sync    │
   │    path      (protagonist only) SVG path "d" string the asset   │
   │              crawls along. Edit this freely to reroute the crawl.│
   └──────────────────────────────────────────────────────────────┘

   ★★★  HOW TO SWAP A PLACEHOLDER FOR A GENERATED PNG  ★★★
   1. Generate a PNG with TRANSPARENT background (the shape only),
      cropped tight, at the aspect ratio close to that asset's w:h.
   2. Save it next to this file, e.g.  ./assets/protagonist.png
   3. In the ASSETS entry, set:   src: "assets/protagonist.png"
   4. Reload. Done — nothing else changes. Position, size, layer,
      intro animation, idle motion and (for the hero) the crawl all
      keep working, because rendering reads `src`: when it's a string
      we draw an <image>; when it's null we call the placeholder
      function. ALL placeholder drawing lives in the DRAW table at the
      bottom and is never touched by layout/animation code.
      Tip: nudge w/h to match your PNG's true proportions for a
      perfect fit (images use preserveAspectRatio="xMidYMid meet").
   ================================================================== */

const SVGNS = "http://www.w3.org/2000/svg";
const ART = 100; // every placeholder is drawn in a 100x100 box centered on (0,0)

/* ---- shared color sets for snail variants (keeps registry readable) ---- */
const SHELL = {
  amber: { body:"#EC9A78", foot:"#D97E5E", a:"#E2952F", b:"#BF6E1E", c:"#F6CE74", spiral:"#A85A18", banded:true },
  coral: { body:"#E98F7C", foot:"#D2705F", a:"#E0705E", b:"#BF4E3D", c:"#F4A896" },
  gold:  { body:"#E7B473", foot:"#D29A55", a:"#E4AE3F", b:"#C58A22", c:"#F7DC92" },
  sage:  { body:"#AABF85", foot:"#8FA86A", a:"#93A86A", b:"#728A4E", c:"#C3D49C" },
  rose:  { body:"#DDA0A6", foot:"#C8848C", a:"#D98C9A", b:"#B96A78", c:"#F0C2C8" },
};

/* =======================  THE SCENE  ============================= */
const ASSETS = [
  /* ---------- LAYER 0 : sky (farthest) ---------- */
  { id:"sky", type:"sky", layer:0, x:600, y:400, w:1500, h:1100,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:0 },

  { id:"sun", type:"sun", layer:0, x:360, y:210, w:760, h:760,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:120 },

  /* ---------- LAYER 1 : far foliage (soft, blurred-feeling blobs) ---------- */
  { id:"foliage-far-l", type:"foliage", layer:1, x:230, y:250, w:720, h:620,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:160,
    idle:"sway", idleDur:11, idleDelay:0, opts:{tone:"far"} },
  { id:"foliage-far-r", type:"foliage", layer:1, x:1010, y:210, w:780, h:660,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:220,
    idle:"sway", idleDur:13, idleDelay:2, opts:{tone:"far"} },

  /* ---------- LAYER 2 : mid foliage ---------- */
  { id:"foliage-mid-l", type:"foliage", layer:2, x:140, y:430, w:620, h:560,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:240,
    idle:"sway", idleDur:9, idleDelay:1, opts:{tone:"mid"} },
  { id:"foliage-mid-r", type:"foliage", layer:2, x:1080, y:470, w:640, h:560,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:300,
    idle:"sway", idleDur:10, idleDelay:3, opts:{tone:"mid"} },

  /* ---------- LAYER 3 : ground / clearing ---------- */
  { id:"ground", type:"ground", layer:3, x:600, y:660, w:1500, h:520,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:120 },

  /* ---------- LAYER 4 : the mossy rock (the stage for everyone) ---------- */
  { id:"rock", type:"rock", layer:4, x:600, y:600, w:820, h:420,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:260 },

  /* ---------- LAYER 5 : set dressing behind the creatures ---------- */
  { id:"mushroom-1", type:"mushroom", layer:5, x:352, y:512, w:120, h:130,
    anchor:{ax:.5,ay:1}, src:null, intro:"pop", delay:1500,
    idle:"breathe", idleDur:6, idleDelay:.4, opts:{cap:"#E27A5E"} },
  { id:"mushroom-2", type:"mushroom", layer:5, x:430, y:548, w:84, h:92,
    anchor:{ax:.5,ay:1}, src:null, intro:"pop", delay:1680,
    idle:"breathe", idleDur:5.4, idleDelay:1.1, opts:{cap:"#E8A24A"} },
  { id:"mushroom-3", type:"mushroom", layer:5, x:858, y:540, w:100, h:108,
    anchor:{ax:.5,ay:1}, src:null, intro:"pop", delay:1820,
    idle:"breathe", idleDur:6.2, idleDelay:.7, opts:{cap:"#D98C9A"} },
  { id:"grass-1", type:"grass", layer:5, x:300, y:560, w:150, h:120,
    anchor:{ax:.5,ay:1}, src:null, intro:"pop", delay:1400, idle:"sway", idleDur:7, idleDelay:0 },
  { id:"grass-2", type:"grass", layer:5, x:910, y:580, w:160, h:130,
    anchor:{ax:.5,ay:1}, src:null, intro:"pop", delay:1560, idle:"sway", idleDur:8, idleDelay:1.5 },

  /* ---------- LAYER 6 : the resident colony + critters (gently alive) ---------- */
  { id:"snail-coral", type:"snail", layer:6, x:430, y:506, w:128, h:112,
    anchor:{ax:.5,ay:.86}, src:null, intro:"pop", delay:2000,
    idle:"breathe", idleDur:5, idleDelay:.3, opts:SHELL.coral },
  { id:"snail-gold", type:"snail", layer:6, x:792, y:530, w:118, h:104,
    anchor:{ax:.5,ay:.86}, src:null, intro:"pop", delay:2200,
    idle:"breathe", idleDur:5.6, idleDelay:1.2, opts:{...SHELL.gold, flip:true} },
  { id:"snail-sage", type:"snail", layer:6, x:548, y:486, w:92, h:82,
    anchor:{ax:.5,ay:.86}, src:null, intro:"pop", delay:2380,
    idle:"breathe", idleDur:6, idleDelay:.8, opts:SHELL.sage },
  { id:"snail-rose", type:"snail", layer:6, x:706, y:478, w:80, h:72,
    anchor:{ax:.5,ay:.86}, src:null, intro:"pop", delay:2520,
    idle:"breathe", idleDur:5.2, idleDelay:1.9, opts:{...SHELL.rose, flip:true} },

  { id:"ladybug", type:"ladybug", layer:6, x:512, y:548, w:64, h:60,
    anchor:{ax:.5,ay:.7}, src:null, intro:"pop", delay:2100,
    idle:"bob", idleDur:3.4, idleDelay:.5 },
  { id:"beetle", type:"beetle", layer:6, x:636, y:560, w:78, h:72,
    anchor:{ax:.5,ay:.7}, src:null, intro:"pop", delay:2260,
    idle:"bob", idleDur:3.8, idleDelay:1.4 },
  { id:"frog", type:"frog", layer:6, x:830, y:512, w:104, h:96,
    anchor:{ax:.5,ay:.82}, src:null, intro:"pop", delay:2440,
    idle:"breathe", idleDur:4.4, idleDelay:.2 },

  /* ---------- LAYER 7 : the leaf (drifts in, then the hero rides it) ---------- */
  { id:"leaf", type:"leaf", layer:7, x:648, y:430, w:440, h:210,
    anchor:{ax:.5,ay:.5}, src:"assets/leaf.png", intro:"leaf", delay:3000,
    idle:"sway", idleDur:7.5, idleDelay:.2 },

  /* ---------- LAYER 8 : THE PROTAGONIST (focal action) ----------
     Position is driven every frame by the rAF crawl along `path`.
     anchor.ay is low so the snail's foot rides the path line.
     Edit `path` (an SVG "d") to reroute the crawl.                */
  { id:"protagonist", type:"snail", layer:8, x:0, y:0, w:158, h:140,
    anchor:{ax:.5,ay:.82}, src:"assets/snail.png", intro:"fade", delay:4700,
    idle:"breathe", idleDur:2.6, idleDelay:0,
    opts:{...SHELL.amber, hero:true},
    path:"M 500 452 C 580 432, 660 416, 730 402 C 782 392, 818 389, 848 389" },
];

/* =================  TIMELINE (ms, relative to play start)  ====== */
const CRAWL_START = 4900;   // when the hero begins moving (matches its intro delay-ish)
const CRAWL_DUR   = 4300;   // ~4.3s of slow, tender travel
const CAPTION_AT  = 7600;   // when the "home" caption fades in

/* =================  PARALLAX (depth-ready structure)  ==========
   Each LAYER gets its own <g>. We nudge those groups on pointer
   move — the hook you can later expand for real depth motion.
   Far layers move more; near layers move less. Kept subtle so the
   full-bleed (slice) edges never show. Disabled feel during a clean
   screen-record because it only reacts to the mouse.            */
const PARALLAX_MAX = 14; // px at screen edge for the farthest layer

/* ================================================================
   RENDERING  — builds the SVG DOM from ASSETS. Layout/animation
   code below never knows whether an asset is a shape or a PNG.
   ================================================================ */
const scene = document.getElementById("scene");
let layerGroups = {};   // layer index -> <g>
let hero = null;        // refs the protagonist's pos-group + sampled path
let rafId = null;

function el(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  if(attrs) for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* Renders one asset into nested groups:
   <g.pos>            position + rotation (attribute; rAF writes here for hero)
     <g.intro>        CSS reveal (opacity / translate / rotate)
       <g.idle>       CSS endless life (breathe / bob / sway)
         <g.art>      anchor offset + size scale -> holds shape OR image
   Separate elements keep the four transforms from clobbering each other. */
function renderAsset(a){
  const pos = el("g", { class:"pos", transform:`translate(${a.x},${a.y}) rotate(${a.rot||0})` });
  pos.dataset.id = a.id;

  const intro = el("g", { class:"intro" });
  applyIntro(intro, a);

  const idle = el("g", { class:"idle" });
  if(a.idle){
    idle.style.animation = `${a.idle} ${a.idleDur||5}s ease-in-out infinite`;
    idle.style.animationDelay = `${a.idleDelay||0}s`;
  }

  // anchor offset + size scale. Art is centered in a 100-box; shift so the
  // chosen anchor lands on (a.x,a.y), then scale the box to w x h.
  const sx = a.w/ART, sy = a.h/ART;
  const ax = a.anchor?.ax ?? .5, ay = a.anchor?.ay ?? .5;
  const offX = (.5-ax)*a.w, offY = (.5-ay)*a.h;
  const art = el("g", { class:"art", transform:`translate(${offX},${offY}) scale(${sx},${sy})` });
  art.innerHTML = renderArtBody(a);

  idle.appendChild(art);
  intro.appendChild(idle);
  pos.appendChild(intro);
  return pos;
}

/* The ONE place that decides shape-vs-image. */
function renderArtBody(a){
  if(a.src){
    // Swap path: same 100-box, so it inherits identical position/size/anchor.
    return `<image href="${a.src}" x="-50" y="-50" width="100" height="100"
             preserveAspectRatio="xMidYMid meet"/>`;
  }
  const draw = DRAW[a.type];
  return draw ? draw(a.opts||{}) : `<rect x="-50" y="-50" width="100" height="100" fill="#ccc"/>`;
}

function applyIntro(node, a){
  const d = `${a.delay||0}ms`;
  switch(a.intro){
    case "settle": node.style.animation = `settleIn 1.4s cubic-bezier(.22,.61,.36,1) both`; break;
    case "leaf":   node.style.animation = `leafIn 1.8s cubic-bezier(.22,.7,.3,1) both`; break;
    case "fade":   node.style.animation = `fadeUp 1.1s ease both`; break;
    case "none":   node.style.opacity = 1; return;
    case "pop":
    default:       node.style.animation = `popIn .95s cubic-bezier(.22,1.1,.36,1) both`; break;
  }
  node.style.animationDelay = d;
}

/* Build (or rebuild, for replay) the whole scene fresh. */
function buildScene(){
  scene.innerHTML = "";
  layerGroups = {};
  hero = null;

  // gradients / soft defs
  const defs = el("defs");
  defs.innerHTML = `
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--sky-top)"/>
      <stop offset="1" stop-color="var(--sky-bot)"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--sun)" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="var(--sun)" stop-opacity="0.45"/>
      <stop offset="1" stop-color="var(--sun)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--ground-top)"/>
      <stop offset="1" stop-color="var(--ground-bot)"/>
    </linearGradient>
    <linearGradient id="rockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--rock-light)"/>
      <stop offset="1" stop-color="var(--rock-base)"/>
    </linearGradient>`;
  scene.appendChild(defs);

  // one <g> per layer, in ascending z-order
  const layers = [...new Set(ASSETS.map(a=>a.layer))].sort((p,q)=>p-q);
  for(const L of layers){
    const g = el("g", { class:"layer", "data-layer":L });
    layerGroups[L] = g;
    scene.appendChild(g);
  }

  // place assets
  for(const a of ASSETS){
    const node = renderAsset(a);
    layerGroups[a.layer].appendChild(node);
    if(a.id === "protagonist"){
      hero = { pos:node, asset:a, path:samplePath(a.path) };
    }
  }

  // foreground floating motes (pure decoration, top layer)
  spawnMotes();
}

/* Floating pollen/dust — small, low-opacity, drifting upward. */
function spawnMotes(){
  const top = Math.max(...Object.keys(layerGroups).map(Number));
  const g = el("g", { class:"motes" });
  layerGroups[top].appendChild(g);
  for(let i=0;i<16;i++){
    const x = 120 + Math.random()*960;
    const y = 200 + Math.random()*420;
    const r = 1.6 + Math.random()*2.8;
    const c = el("circle", { cx:x, cy:y, r, fill: Math.random()<.5 ? "#FCEFD0":"#FFFFFF" });
    c.style.setProperty("--dx", `${(Math.random()-.5)*60}px`);
    c.style.setProperty("--dy", `${-90 - Math.random()*120}px`);
    c.style.animation = `floatMote ${7+Math.random()*6}s linear infinite`;
    c.style.animationDelay = `${Math.random()*8}s`;
    c.style.opacity = 0;
    g.appendChild(c);
  }
}

/* ================================================================
   PROTAGONIST CRAWL  — rAF along the asset's `path` data.
   ================================================================ */
function samplePath(d){
  // A throwaway <path> just for geometry queries (getPointAtLength).
  const p = el("path", { d });
  p.style.visibility = "hidden";
  scene.appendChild(p);
  const len = p.getTotalLength();
  return { node:p, len };
}

// gentle ease-in-out so the crawl starts and ends softly
const easeInOut = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;

let playStart = 0;
function tick(now){
  const t = now - playStart;

  // caption
  if(t >= CAPTION_AT) document.getElementById("caption").style.transition="opacity 2.2s ease",
                      document.getElementById("caption").style.opacity = .85;

  if(hero){
    if(t < CRAWL_START){
      // wait at the start of the path so the fade-in reveal reads cleanly
      placeHeroAt(0);
    }else{
      const raw = Math.min((t - CRAWL_START)/CRAWL_DUR, 1);
      placeHeroAt(easeInOut(raw));
      if(raw >= 1){ /* arrived; idle breathe continues via CSS */ }
    }
  }
  rafId = requestAnimationFrame(tick);
}

function placeHeroAt(progress){
  const { path, asset } = hero;
  const d = Math.max(0, Math.min(path.len, progress*path.len));
  const pt  = path.node.getPointAtLength(d);
  const pt2 = path.node.getPointAtLength(Math.min(path.len, d + 1.5));
  let ang = Math.atan2(pt2.y-pt.y, pt2.x-pt.x) * 180/Math.PI;
  // keep the snail readable: clamp the tilt so it never looks like it's falling
  ang = Math.max(-16, Math.min(16, ang));
  hero.pos.setAttribute("transform", `translate(${pt.x},${pt.y}) rotate(${ang})`);
}

/* ================================================================
   PLAY / REPLAY
   ================================================================ */
function play(){
  if(rafId) cancelAnimationFrame(rafId);
  document.getElementById("caption").style.transition = "none";
  document.getElementById("caption").style.opacity = 0;
  buildScene();
  // force a reflow so freshly-added CSS animations restart from frame 0
  void scene.getBoundingClientRect();
  playStart = performance.now();
  rafId = requestAnimationFrame(tick);
}

document.getElementById("replay").addEventListener("click", play);

/* ---- parallax pointer hook (subtle; expand later for depth) ---- */
const layerCount = [...new Set(ASSETS.map(a=>a.layer))].length;
window.addEventListener("pointermove", (e)=>{
  const nx = (e.clientX/window.innerWidth  - .5)*2;
  const ny = (e.clientY/window.innerHeight - .5)*2;
  const keys = Object.keys(layerGroups).map(Number).sort((a,b)=>a-b);
  keys.forEach((L,i)=>{
    // farthest layer (i=0) moves most; nearest moves least
    const depth = (1 - i/(keys.length-1)) * PARALLAX_MAX;
    const g = layerGroups[L];
    g.style.transition = "transform .5s cubic-bezier(.2,.7,.3,1)";
    g.style.transform = `translate(${ -nx*depth }px, ${ -ny*depth }px)`;
  });
});
