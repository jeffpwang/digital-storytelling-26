<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A Snail's Tale — Beats 2 & 3: Displacement &amp; Arrival</title>
<style>
  /* ============================================================
     PALETTE
     Warm vars (home / daylight) drive PART A.
     Cool vars (foreign forest floor) drive PART B.
     Both kept side by side — Part A still needs the warm sky.
     ============================================================ */
  :root{
    /* ---- WARM: home + open daylight sky (PART A) ---- */
    --sky-top:#FBE6D2;
    --sky-bot:#F6D2AE;
    --sun:#FCEFD0;

    --foliage-far:#CBD8A2;
    --foliage-mid:#A9C381;
    --foliage-near:#8FB36A;

    --ground-top:#ECCFA4;
    --ground-bot:#E0B888;

    --moss-a:#94B36A;
    --moss-b:#A9C77F;

    --ink:#5A4632;        /* warm "almost-black" — never pure #000 */
    --cream:#FBEAC9;

    /* open-air flight sky + clouds + distant canopy + the bird's talons */
    --air-top:#CFE2EA;
    --air-bot:#F4E6CF;
    --cloud:#FDFBF6;
    --tree:#5E7E63;
    --tree-dk:#4C6852;
    --talon:#A2938A;
    --talon-dk:#6F635C;

    /* ---- COOL: foreign damp forest floor (PART B) ---- */
    --cool-sky-top:#21403E;
    --cool-sky-bot:#3A564E;
    --shaft:#EAF6E6;
    --cool-ground-top:#3C4C42;
    --cool-ground-bot:#293530;
    --log-base:#4C4137;
    --log-shade:#3A322B;
    --log-light:#6A5C4C;
    --lichen-a:#5E8C78;
    --lichen-b:#82AE96;
    --fern-far:#557A66;
    --fern-mid:#6E9A7E;
    --fern-near:#8AB99A;
    --glow-stem:#D2E8DC;
    --cool-ink:#24302A;
    --cool-cream:#DCEAE0;
  }

  html,body{height:100%;margin:0;}
  body{
    background:#15110D;   /* deep frame so the square scene pops out of the letterbox */
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* Stage is a SQUARE, centered, sized to the smaller window dimension.
     The SVG inside shows the central square crop of the 1200x800 layout
     (viewBox "200 0 800 800"), slice-filling the square edge-to-edge.
     Overlays below live INSIDE the stage so they clip to the square. */
  #stage{
    position:fixed;
    top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(100vw,100vh);
    height:min(100vw,100vh);
    overflow:hidden;
    border-radius:6px;
    box-shadow:0 24px 80px rgba(0,0,0,.45);
  }
  #scene{width:100%;height:100%;display:block;}

  /* Warm vignette + glow (PART A). Sits above the scene, ignores clicks. */
  #vignette{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 90% at 32% 26%, rgba(255,247,228,.28), rgba(255,247,228,0) 45%),
      radial-gradient(130% 120% at 50% 58%, rgba(0,0,0,0) 55%, rgba(90,70,50,.16) 100%);
    mix-blend-mode:multiply;opacity:.9;
    transition:background .8s ease;
  }
  #glow{
    position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 45% at 34% 24%, rgba(255,246,222,.35), rgba(255,246,222,0) 60%);
    transition:background .8s ease;
  }

  /* PART B retints the same vignette/glow cool — light from a canopy gap
     above, cool shadow pooling below. Added via #stage.cool at arrival. */
  #stage.cool #glow{
    background:radial-gradient(55% 42% at 50% 6%, rgba(222,246,234,.32), rgba(222,246,234,0) 62%);
  }
  #stage.cool #vignette{
    background:
      radial-gradient(120% 80% at 50% 10%, rgba(214,242,230,.16), rgba(214,242,230,0) 45%),
      radial-gradient(130% 120% at 50% 60%, rgba(0,0,0,0) 42%, rgba(10,24,20,.46) 100%);
  }

  /* Fade-to-black between the worlds (and the open/close fades). */
  #fadeblack{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;}

  /* Subtle beat caption, fades in near the end (same treatment as Beat 1). */
  #caption{
    position:absolute;left:0;right:0;bottom:7%;text-align:center;
    color:var(--cool-cream);opacity:0;pointer-events:none;
    font-size:clamp(15px,2.4vw,26px);letter-spacing:.55em;
    text-transform:lowercase;font-weight:500;
    text-indent:.55em; /* compensate trailing letter-spacing for true centering */
  }

  /* Replay control — quiet by default, brightens on hover. For clean screen-records. */
  #replay{
    position:fixed;right:18px;bottom:16px;
    display:flex;align-items:center;gap:8px;
    background:rgba(220,234,224,.5);color:#1d2a24;
    border:1px solid rgba(255,255,255,.18);
    padding:9px 14px;border-radius:999px;
    font-size:13px;letter-spacing:.06em;cursor:pointer;
    opacity:.4;transition:opacity .3s ease, transform .2s ease, background .3s ease;
    backdrop-filter:blur(3px);
  }
  #replay:hover{opacity:1;background:rgba(232,244,236,.85);}
  #replay:active{transform:scale(.96);}
  #replay svg{width:14px;height:14px;}

  /* ============================================================
     ANIMATION KEYFRAMES  (identical set to Beat 1)
     CSS handles: intro reveals + endless idle "life".
     JS (rAF) handles: the Part A cinematic timeline + Part B crawl.
     ============================================================ */
  @keyframes popIn{
    from{opacity:0;transform:translateY(16px) scale(.92);}
    to  {opacity:1;transform:translateY(0)    scale(1);}
  }
  @keyframes settleIn{
    from{opacity:0;transform:scale(1.05);}
    to  {opacity:1;transform:scale(1);}
  }
  @keyframes leafIn{
    0%  {opacity:0;transform:translate(230px,-180px) rotate(34deg);}
    55% {opacity:1;}
    100%{opacity:1;transform:translate(0,0) rotate(0deg);}
  }
  @keyframes fadeUp{
    from{opacity:0;}
    to  {opacity:1;}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1,1);}
    50%    {transform:scale(1.035,.965);}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%    {transform:translateY(-3px);}
  }
  @keyframes sway{
    0%,100%{transform:rotate(-1.4deg);}
    50%    {transform:rotate(1.4deg);}
  }
  @keyframes floatMote{
    0%  {transform:translate(0,0);opacity:0;}
    15% {opacity:.7;}
    85% {opacity:.5;}
    100%{transform:translate(var(--dx),var(--dy));opacity:0;}
  }

  @media (prefers-reduced-motion: reduce){
    .idle{animation:none !important;}
  }
</style>
</head>
<body>
  <div id="stage">
    <svg id="scene" viewBox="200 0 800 800" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="An amber-shelled snail is lifted by bird talons, carried through the sky, released to fall, and arrives in a strange cool forest of slugs."></svg>
    <div id="glow"></div>
    <div id="vignette"></div>
    <div id="fadeblack"></div>
    <div id="caption">elsewhere</div>
  </div>

  <button id="replay" title="Replay">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
    </svg>
    replay
  </button>

<script>
/* ==================================================================
   A SNAIL'S TALE — Beats 2 & 3
   One continuous autoplaying timeline:
     PART A  DISPLACEMENT  (the snatch, the carry, the fall, fade to black)
     PART B  ARRIVAL       (enters exactly like Beat 1 opened — but the
                            world is a cool, foreign forest floor of slugs)
   Single-file. No frameworks, no build. SAME architecture as Beat 1:
   ASSETS registry -> per-layer <g> groups -> four nested transforms
   (pos -> intro -> idle -> art) -> src:null draws a placeholder, a
   string draws a swappable PNG. rAF drives motion; DRAW table holds
   every placeholder shape.
   ------------------------------------------------------------------

   ┌──────────────────────────────────────────────────────────────┐
   │  ASSET REGISTRY  — one object per visual element. Fields are    │
   │  IDENTICAL to Beat 1:                                            │
   │    id, type, layer (z-order), x, y, w, h, anchor{ax,ay},        │
   │    rot, src (null=placeholder / "x.png"=image), opts,           │
   │    intro ('pop'|'settle'|'leaf'|'fade'|'none'), delay (ms),     │
   │    idle ('breathe'|'bob'|'sway'|null), idleDur, idleDelay,      │
   │    path (protagonist only — SVG "d" the hero crawls along).     │
   │                                                                 │
   │  There are TWO registries here, one per part:                   │
   │    ASSETS_A  the displacement (sky, clouds, talons, trees,      │
   │              ground patch, the hero snail being carried).        │
   │    ASSETS_B  the foreign arrival (cool sky, light shafts, log,  │
   │              ferns, glowing mushrooms, slugs, leaf, the hero).   │
   │  Part B is built fresh at ARRIVAL_AT so its Beat-1-style intro  │
   │  animations play on cue, behind the fade-to-black.              │
   └──────────────────────────────────────────────────────────────┘

   ★★★  HOW TO SWAP A PLACEHOLDER FOR A GENERATED PNG  (unchanged)  ★★★
   1. Generate a PNG with TRANSPARENT background, cropped tight, at an
      aspect ratio close to that asset's w:h.
   2. Save it next to this file, e.g.  ./assets/talons.png
   3. In the ASSETS_A / ASSETS_B entry, set:   src: "assets/talons.png"
   4. Reload. Nothing else changes — position, size, layer, intro,
      idle motion, the Part A cinematic moves and the Part B crawl all
      keep working, because renderArtBody() reads `src`: a string ->
      <image>, null -> DRAW[type](). The hero already points at
      "assets/snail.png" in BOTH parts, so it stays visually identical
      to Beat 1. New placeholder types you can swap: talons, cloud,
      treetop, groundPatch, airsky, coolSky, lightShafts, coolGround,
      log, fern, frond, glowMushroom, slug, foreignLeaf.
      Tip: nudge w/h to match your PNG's true proportions for a perfect
      fit (images use preserveAspectRatio="xMidYMid meet").
   ================================================================== */

const SVGNS = "http://www.w3.org/2000/svg";
const ART = 100; // every placeholder is drawn in a 100x100 box centered on (0,0)

/* ---- shared color sets (keep registries readable) ---- */
const SHELL = {
  // the hero — same amber spiral-banded shell as Beat 1
  amber: { body:"#EC9A78", foot:"#D97E5E", a:"#E2952F", b:"#BF6E1E", c:"#F6CE74", spiral:"#A85A18", banded:true },
};
const SLUG = {
  // foreign residents — shell-less, cool, translucent-feeling
  jade:   { body:"#9FD0BC", foot:"#84B7A2", ridge:"#6FA08C", eye:"#34463E" },
  violet: { body:"#BCB2D2", foot:"#A89EC2", ridge:"#9286AE", eye:"#3A3548" },
  pale:   { body:"#C2E2D4", foot:"#A6CFBE", ridge:"#8FB9A8", eye:"#34463E" },
};

const HERO_SRC = "assets/snail.png"; // shared so the hero is identical across parts/beats

/* =======================  PART A — DISPLACEMENT  ================= */
const ASSETS_A = [
  /* ---------- LAYER 0 : open daylight sky ---------- */
  { id:"airsky", type:"airsky", layer:0, x:600, y:400, w:1500, h:1100,
    anchor:{ax:.5,ay:.5}, src:null, intro:"none" },

  /* ---------- LAYER 1 : far clouds (slow, large) — drift + rush, rAF-driven ---------- */
  { id:"cloud-0", type:"cloud", layer:1, x:300, y:180, w:360, h:180, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{sp:0.7, depth:0.8} },
  { id:"cloud-1", type:"cloud", layer:1, x:830, y:120, w:430, h:200, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{sp:0.9, depth:0.7} },
  { id:"cloud-2", type:"cloud", layer:1, x:600, y:320, w:320, h:150, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{sp:1.1, depth:1.0} },

  /* ---------- LAYER 2 : near clouds (faster, closer) ---------- */
  { id:"cloud-3", type:"cloud", layer:2, x:180, y:430, w:300, h:150, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{sp:1.3, depth:1.2} },
  { id:"cloud-4", type:"cloud", layer:2, x:920, y:470, w:360, h:170, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{sp:1.5, depth:1.3} },
  { id:"cloud-5", type:"cloud", layer:2, x:520, y:580, w:280, h:140, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{sp:1.0, depth:1.1} },

  /* ---------- LAYER 4 : the little home ground patch (falls away) ---------- */
  { id:"ground-patch", type:"groundPatch", layer:4, x:600, y:600, w:380, h:160,
    anchor:{ax:.5,ay:.5}, src:null, intro:"none" },

  /* ---------- LAYER 5 : forest canopy that rises during the landing approach ----------
     Start far below the frame (y:1180); orchestrateA() lifts + scales them. */
  { id:"tree-0", type:"treetop", layer:5, x:80,   y:1180, w:460, h:380, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{restY:640} },
  { id:"tree-1", type:"treetop", layer:5, x:340,  y:1180, w:540, h:440, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{restY:600} },
  { id:"tree-2", type:"treetop", layer:5, x:660,  y:1180, w:560, h:460, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{restY:580} },
  { id:"tree-3", type:"treetop", layer:5, x:960,  y:1180, w:520, h:420, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{restY:610} },
  { id:"tree-4", type:"treetop", layer:5, x:1180, y:1180, w:480, h:400, anchor:{ax:.5,ay:.5},
    src:null, intro:"none", opts:{restY:640} },

  /* ---------- LAYER 6 : the hero snail (carried, then falling) ----------
     Center anchor here (it is positioned by orchestrateA, not riding a path). */
  { id:"hero-A", type:"snail", layer:6, x:600, y:540, w:160, h:142,
    anchor:{ax:.5,ay:.5}, src:HERO_SRC, intro:"none",
    idle:"breathe", idleDur:2.8, idleDelay:0, opts:{...SHELL.amber, hero:true} },

  /* ---------- LAYER 8 : the talons (we only ever see the feet) ----------
     Begins above the frame; orchestrateA() descends, grabs, lifts, releases. */
  { id:"talons", type:"talons", layer:8, x:600, y:-300, w:320, h:420,
    anchor:{ax:.5,ay:.5}, src:null, intro:"none" },
];

/* =======================  PART B — ARRIVAL (foreign)  ===========
   Same shape + rhythm as Beat 1's opening: backdrops settle, dressing
   pops, the leaf drifts in, the hero fades in and crawls. Cool content. */
const ASSETS_B = [
  /* ---------- LAYER 0 : deep cool sky / canopy depth ---------- */
  { id:"coolsky", type:"coolSky", layer:0, x:600, y:400, w:1500, h:1100,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:0 },

  /* ---------- LAYER 1 : far drooping fronds + pale light shafts ---------- */
  { id:"frond-far-l", type:"frond", layer:1, x:200, y:250, w:540, h:600, anchor:{ax:.5,ay:.5},
    src:null, intro:"settle", delay:200, idle:"sway", idleDur:12, idleDelay:0, opts:{tone:"far"} },
  { id:"frond-far-r", type:"frond", layer:1, x:1010, y:220, w:560, h:620, anchor:{ax:.5,ay:.5},
    src:null, intro:"settle", delay:260, idle:"sway", idleDur:14, idleDelay:2, opts:{tone:"far", flip:true} },
  { id:"shafts", type:"lightShafts", layer:1, x:560, y:280, w:1100, h:1000, anchor:{ax:.5,ay:.5},
    src:null, intro:"settle", delay:120 },

  /* ---------- LAYER 2 : damp forest floor ---------- */
  { id:"coolground", type:"coolGround", layer:2, x:600, y:680, w:1500, h:520,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:120 },

  /* ---------- LAYER 3 : the wet log (the stage — replaces home's rock) ---------- */
  { id:"log", type:"log", layer:3, x:600, y:612, w:900, h:230,
    anchor:{ax:.5,ay:.5}, src:null, intro:"settle", delay:260 },

  /* ---------- LAYER 4 : set dressing behind the residents ---------- */
  { id:"glowmush-1", type:"glowMushroom", layer:4, x:300, y:560, w:124, h:144, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1400, idle:"breathe", idleDur:5, idleDelay:.4, opts:{cap:"jade"} },
  { id:"glowmush-2", type:"glowMushroom", layer:4, x:520, y:560, w:92, h:106, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1600, idle:"breathe", idleDur:5.6, idleDelay:1.1, opts:{cap:"violet"} },
  { id:"glowmush-3", type:"glowMushroom", layer:4, x:812, y:556, w:108, h:124, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1760, idle:"breathe", idleDur:6, idleDelay:.7, opts:{cap:"jade"} },
  { id:"fern-1", type:"fern", layer:4, x:360, y:566, w:150, h:185, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1500, idle:"sway", idleDur:7, idleDelay:0, opts:{tone:"near"} },
  { id:"fern-2", type:"fern", layer:4, x:470, y:588, w:110, h:140, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1680, idle:"sway", idleDur:6.4, idleDelay:1.1, opts:{tone:"mid"} },
  { id:"fern-3", type:"fern", layer:4, x:884, y:572, w:140, h:172, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1820, idle:"sway", idleDur:7.5, idleDelay:.6, opts:{tone:"near", flip:true} },

  /* ---------- LAYER 5 : the resident colony — SLUGS ONLY (no shells) ---------- */
  { id:"slug-jade", type:"slug", layer:5, x:440, y:548, w:140, h:96, anchor:{ax:.5,ay:.86},
    src:null, intro:"pop", delay:2000, idle:"breathe", idleDur:5.2, idleDelay:.3, opts:SLUG.jade },
  { id:"slug-violet", type:"slug", layer:5, x:786, y:560, w:130, h:90, anchor:{ax:.5,ay:.86},
    src:null, intro:"pop", delay:2200, idle:"sway", idleDur:6, idleDelay:1.2, opts:{...SLUG.violet, flip:true} },
  { id:"slug-pale", type:"slug", layer:5, x:602, y:540, w:110, h:78, anchor:{ax:.5,ay:.86},
    src:null, intro:"pop", delay:2380, idle:"breathe", idleDur:5.8, idleDelay:.8, opts:SLUG.pale },
  { id:"slug-jade-2", type:"slug", layer:5, x:694, y:520, w:92, h:66, anchor:{ax:.5,ay:.86},
    src:null, intro:"pop", delay:2520, idle:"sway", idleDur:6.4, idleDelay:1.9, opts:{...SLUG.jade, flip:true} },

  /* ---------- LAYER 6 : the leaf (a different, cooler shape than home's) ---------- */
  { id:"leaf", type:"foreignLeaf", layer:6, x:648, y:444, w:430, h:210,
    anchor:{ax:.5,ay:.5}, src:null, intro:"leaf", delay:3000, idle:"sway", idleDur:7.5, idleDelay:.2 },

  /* ---------- LAYER 7 : THE PROTAGONIST — same hero, identical to Beat 1 ----------
     Fades in then crawls the path. The single shelled, warm-toned creature here. */
  { id:"protagonist", type:"snail", layer:7, x:0, y:0, w:158, h:140,
    anchor:{ax:.5,ay:.82}, src:HERO_SRC, intro:"fade", delay:4700,
    idle:"breathe", idleDur:2.6, idleDelay:0, opts:{...SHELL.amber, hero:true},
    path:"M 500 470 C 585 450, 665 434, 735 420 C 786 410, 820 407, 848 408" },

  /* ---------- LAYER 8 : foreground fronds (depth framing) ---------- */
  { id:"frond-fg-l", type:"fern", layer:8, x:210, y:700, w:300, h:340, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1300, idle:"sway", idleDur:9, idleDelay:.5, opts:{tone:"far"} },
  { id:"frond-fg-r", type:"fern", layer:8, x:1000, y:710, w:320, h:360, anchor:{ax:.5,ay:1},
    src:null, intro:"pop", delay:1450, idle:"sway", idleDur:10, idleDelay:1.6, opts:{tone:"far", flip:true} },
];

const CAPTION_B = "elsewhere"; // ← the foreign-beat word. Yours to change.

/* ================================================================
   TIMELINE  (ms from play start). One place to retune the rhythm.
   ================================================================ */
const INTRO_FADE   = 600;    // Part A fades in from black
const SNATCH_AT    = 300;    // talons begin descending from the top
const GRAB_AT      = 1500;   // talons close around the resting snail
const LIFT_AT      = 2500;   // snail held aloft against the open sky
const FALL_AT      = 4500;   // talons open & retract; the fall begins (world rushes UP)
const TREES_AT     = 7000;   // forest canopy rises from the bottom (ground approaching)
const FADEOUT_AT   = 9200;   // begin the fade to black
const FADE_DUR     = 1300;   // length of every black fade (out, and back in)
const BLACK_HOLD   = 700;    // beat held on full black between worlds
const ARRIVAL_AT   = FADEOUT_AT + FADE_DUR + BLACK_HOLD; // Part B builds + fades up (~11.2s)

/* Part B mirrors Beat 1's INTERNAL rhythm, measured from ARRIVAL_AT: */
const ARRIVAL_CRAWL_START = 4900; // hero begins crawling (same as Beat 1's CRAWL_START)
const CRAWL_DUR           = 4300; // same tender travel
const ARRIVAL_CAPTION_AT  = 7600; // caption fades in (same as Beat 1's CAPTION_AT)

/* =================  PARALLAX (depth-ready structure)  ==========
   Each LAYER is its own <g>; nudged subtly on pointer move. Hook to
   expand into real depth motion later. (Idle during clean records.) */
const PARALLAX_MAX = 14;

/* ================================================================
   RENDERING  — builds the SVG DOM from a registry. Layout/animation
   never knows whether an asset is a shape or a PNG.
   ================================================================ */
const scene    = document.getElementById("scene");
const stage    = document.getElementById("stage");
const fadeEl   = document.getElementById("fadeblack");
const captionEl= document.getElementById("caption");

let layerGroups = {};   // layer index -> <g>
let nodeById    = {};   // asset id -> .pos <g>   (so the timeline can drive them)
let hero        = null; // protagonist's pos-group + sampled path (Part B only)
let rafId       = null;
let phase       = "A";  // "A" displacement | "B" arrival
let talonsOpened= false;
let arrivalBuilt= false;

function el(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  if(attrs) for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/* Nested groups (same as Beat 1):
   <g.pos>   position+rotation (attribute; rAF writes here)
     <g.intro>   CSS reveal
       <g.idle>  CSS endless life
         <g.art> anchor offset + size scale -> shape OR image */
function renderAsset(a){
  const pos = el("g", { class:"pos", transform:`translate(${a.x},${a.y}) rotate(${a.rot||0})` });
  pos.dataset.id = a.id;

  const intro = el("g", { class:"intro" });
  applyIntro(intro, a);

  const idle = el("g", { class:"idle" });
  if(a.idle){
    idle.style.animation = `${a.idle} ${a.idleDur||5}s ease-in-out infinite`;
    idle.style.animationDelay = `${a.idleDelay||0}s`;
  }

  const sx = a.w/ART, sy = a.h/ART;
  const ax = a.anchor?.ax ?? .5, ay = a.anchor?.ay ?? .5;
  const offX = (.5-ax)*a.w, offY = (.5-ay)*a.h;
  const art = el("g", { class:"art", transform:`translate(${offX},${offY}) scale(${sx},${sy})` });
  art.innerHTML = renderArtBody(a);

  idle.appendChild(art);
  intro.appendChild(idle);
  pos.appendChild(intro);
  return pos;
}

/* The ONE place that decides shape-vs-image. */
function renderArtBody(a){
  if(a.src){
    return `<image href="${a.src}" x="-50" y="-50" width="100" height="100"
             preserveAspectRatio="xMidYMid meet"/>`;
  }
  const draw = DRAW[a.type];
  return draw ? draw(a.opts||{}) : `<rect x="-50" y="-50" width="100" height="100" fill="#ccc"/>`;
}

function applyIntro(node, a){
  const d = `${a.delay||0}ms`;
  switch(a.intro){
    case "settle": node.style.animation = `settleIn 1.4s cubic-bezier(.22,.61,.36,1) both`; break;
    case "leaf":   node.style.animation = `leafIn 1.8s cubic-bezier(.22,.7,.3,1) both`; break;
    case "fade":   node.style.animation = `fadeUp 1.1s ease both`; break;
    case "none":   node.style.opacity = 1; return;
    case "pop":
    default:       node.style.animation = `popIn .95s cubic-bezier(.22,1.1,.36,1) both`; break;
  }
  node.style.animationDelay = d;
}

/* Build (or rebuild) a whole scene fresh from a registry. */
function buildScene(assets, {motes=false, moteColors=["#FFFFFF"]}={}){
  scene.innerHTML = "";
  layerGroups = {};
  nodeById = {};
  hero = null;

  scene.appendChild(buildDefs());

  // one <g> per layer, ascending z-order
  const layers = [...new Set(assets.map(a=>a.layer))].sort((p,q)=>p-q);
  for(const L of layers){
    const g = el("g", { class:"layer", "data-layer":L });
    layerGroups[L] = g;
    scene.appendChild(g);
  }

  for(const a of assets){
    const node = renderAsset(a);
    layerGroups[a.layer].appendChild(node);
    nodeById[a.id] = node;
    if(a.id === "protagonist"){
      hero = { pos:node, asset:a, path:samplePath(a.path) };
    }
  }

  if(motes) spawnMotes(moteColors);
}

/* All gradients for both palettes live here (built once per scene). */
function buildDefs(){
  const defs = el("defs");
  defs.innerHTML = `
    <linearGradient id="airGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--air-top)"/>
      <stop offset="1" stop-color="var(--air-bot)"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--ground-top)"/>
      <stop offset="1" stop-color="var(--ground-bot)"/>
    </linearGradient>
    <linearGradient id="coolSkyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cool-sky-top)"/>
      <stop offset="1" stop-color="var(--cool-sky-bot)"/>
    </linearGradient>
    <linearGradient id="coolGroundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--cool-ground-top)"/>
      <stop offset="1" stop-color="var(--cool-ground-bot)"/>
    </linearGradient>
    <linearGradient id="logGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--log-light)"/>
      <stop offset="1" stop-color="var(--log-base)"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EAFBF1" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#BFEAD6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#BFEAD6" stop-opacity="0"/>
    </radialGradient>`;
  return defs;
}

/* Floating motes — pollen (warm) or drifting spores (cool), per scene. */
function spawnMotes(colors){
  const top = Math.max(...Object.keys(layerGroups).map(Number));
  const g = el("g", { class:"motes" });
  layerGroups[top].appendChild(g);
  for(let i=0;i<16;i++){
    const x = 120 + Math.random()*960;
    const y = 200 + Math.random()*420;
    const r = 1.6 + Math.random()*2.8;
    const c = el("circle", { cx:x, cy:y, r, fill: colors[Math.floor(Math.random()*colors.length)] });
    c.style.setProperty("--dx", `${(Math.random()-.5)*60}px`);
    c.style.setProperty("--dy", `${-90 - Math.random()*120}px`);
    c.style.animation = `floatMote ${7+Math.random()*6}s linear infinite`;
    c.style.animationDelay = `${Math.random()*8}s`;
    c.style.opacity = 0;
    g.appendChild(c);
  }
}

/* ================================================================
   SHARED MATH / HELPERS
   ================================================================ */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp  = (a,b,t)=>a+(b-a)*t;
const easeInOut = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const easeOut   = t => 1 - Math.pow(1-t,3);
const easeIn    = t => t*t*t;
function wrap(v,min,max){ const r=max-min; return min + (((v-min)%r)+r)%r; }
function setOpacity(node,o){ if(node) node.style.opacity = o; }

/* ================================================================
   PART A — DISPLACEMENT (the cinematic, rAF-driven by id)
   ================================================================ */
function orchestrateA(t){
  const snail  = nodeById["hero-A"];
  const talons = nodeById["talons"];
  const ground = nodeById["ground-patch"];

  const REST=[600,540], HELD=[600,360], FALLC=[600,480];
  let sx=REST[0], sy=REST[1], srot=0;
  let tx=600, ty=-300;

  if(t < GRAB_AT){
    /* THE SNATCH — talons descend toward the resting snail. */
    const p = clamp((t-SNATCH_AT)/(GRAB_AT-SNATCH_AT), 0, 1);
    ty = lerp(-300, 350, easeOut(p));     // claws arrive around the snail (~y540)
    sx = REST[0]; sy = REST[1];
  } else if(t < LIFT_AT){
    /* GRAB -> LIFT — talons close and carry the snail upward. */
    const p = clamp((t-GRAB_AT)/(LIFT_AT-GRAB_AT), 0, 1);
    sx = lerp(REST[0], HELD[0], easeInOut(p));
    sy = lerp(REST[1], HELD[1], easeInOut(p));
    ty = lerp(350, 180, easeInOut(p));    // talons hold just above the snail
    setOpacity(ground, 1-p);
    ground?.setAttribute("transform", `translate(600,${600 + p*150})`); // patch drops away
  } else if(t < FALL_AT){
    /* LIFTED — held against open sky, a gentle weightless bob. */
    const bob = Math.sin((t-LIFT_AT)/650)*6;
    sx = HELD[0]; sy = HELD[1]+bob;
    ty = 180+bob;
    setOpacity(ground, 0);
  } else {
    /* RELEASE + FALL — talons open & retract; snail stays centered and
       tumbles weightlessly while the WORLD rushes upward past it. */
    if(!talonsOpened){ openTalons(); talonsOpened = true; }
    const pr = clamp((t-FALL_AT)/700, 0, 1);
    ty = lerp(180, -420, easeIn(pr));     // talons withdraw up out of frame
    setOpacity(talons, 1-pr);

    const ps = clamp((t-FALL_AT)/600, 0, 1);
    sx = lerp(HELD[0], FALLC[0], ps);
    sy = lerp(HELD[1], FALLC[1], ps);
    const ft = (t-FALL_AT)/1000;
    srot = Math.sin(ft*2.1)*10 + Math.sin(ft*0.7)*4; // dreamy, not violent
    sx  += Math.sin(ft*1.3)*10;                       // slight lateral drift
    setOpacity(ground, 0);
  }

  snail ?.setAttribute("transform", `translate(${sx},${sy}) rotate(${srot})`);
  talons?.setAttribute("transform", `translate(${tx},${ty})`);

  /* clouds: always a slow sideways altitude-drift; a vertical rush after FALL_AT */
  const vScroll = t>FALL_AT ? Math.min(0.00045*(t-FALL_AT)*(t-FALL_AT), 9000) : 0;
  updateClouds(t, vScroll);

  /* trees: rise from the bottom and grow during the landing approach */
  updateTrees(t);
}

function updateClouds(t, vScroll){
  for(const c of ASSETS_A){
    if(c.type !== "cloud") continue;
    const node = nodeById[c.id]; if(!node) continue;
    const driftX = (t*0.018)*c.opts.sp;                 // gentle sideways wind
    const x = wrap(c.x - driftX,          -320, 1520);
    const y = wrap(c.y - vScroll*c.opts.depth, -320, 1120); // rush upward, wrapping
    node.setAttribute("transform", `translate(${x},${y})`);
  }
}

function updateTrees(t){
  const p = clamp((t-TREES_AT)/(FADEOUT_AT-TREES_AT+500), 0, 1);
  const e = easeOut(p);
  for(const tr of ASSETS_A){
    if(tr.type !== "treetop") continue;
    const node = nodeById[tr.id]; if(!node) continue;
    const y = lerp(1180, tr.opts.restY, e);   // below frame -> into view
    const s = lerp(0.7, 1.28, e);             // grow as the ground nears
    node.setAttribute("transform", `translate(${tr.x},${y}) scale(${s})`);
  }
}

/* Re-draw the talons as an OPEN claw the instant of release (uses DRAW table). */
function openTalons(){
  const art = nodeById["talons"]?.querySelector(".art");
  if(art) art.innerHTML = DRAW.talons({open:true});
}

/* ================================================================
   PART B — ARRIVAL  (Beat-1-style: hero fades in, then crawls)
   ================================================================ */
function orchestrateB(t){
  if(t >= ARRIVAL_AT + ARRIVAL_CAPTION_AT){
    captionEl.style.transition = "opacity 2.2s ease";
    captionEl.style.opacity = .85;
  }
  if(hero){
    const tb = t - ARRIVAL_AT;
    if(tb < ARRIVAL_CRAWL_START){
      placeHeroAt(0);
    }else{
      const raw = Math.min((tb - ARRIVAL_CRAWL_START)/CRAWL_DUR, 1);
      placeHeroAt(easeInOut(raw));
    }
  }
}

function samplePath(d){
  const p = el("path", { d });
  p.style.visibility = "hidden";
  scene.appendChild(p);
  return { node:p, len:p.getTotalLength() };
}

function placeHeroAt(progress){
  const { path } = hero;
  const d   = clamp(progress*path.len, 0, path.len);
  const pt  = path.node.getPointAtLength(d);
  const pt2 = path.node.getPointAtLength(Math.min(path.len, d + 1.5));
  let ang = Math.atan2(pt2.y-pt.y, pt2.x-pt.x) * 180/Math.PI;
  ang = Math.max(-16, Math.min(16, ang));
  hero.pos.setAttribute("transform", `translate(${pt.x},${pt.y}) rotate(${ang})`);
}

/* The hand-off: build the foreign world behind the black, retint the mood. */
function enterPartB(){
  buildScene(ASSETS_B, { motes:true, moteColors:["#CFEFE0","#FFFFFF","#BFE2D6"] });
  stage.classList.add("cool");
  captionEl.textContent = CAPTION_B;
  phase = "B";
}

/* ================================================================
   FADE CONTROL — open from black, fade to black, hold, fade up to B.
   ================================================================ */
function updateFade(t){
  let op = 0;
  if(t < INTRO_FADE){                               // open Part A from black
    op = 1 - t/INTRO_FADE;
  }else if(t >= FADEOUT_AT && t < FADEOUT_AT+FADE_DUR){   // fade Part A to black
    op = (t-FADEOUT_AT)/FADE_DUR;
  }else if(t >= FADEOUT_AT+FADE_DUR && t < ARRIVAL_AT){   // hold on black
    op = 1;
  }else if(t >= ARRIVAL_AT && t < ARRIVAL_AT+FADE_DUR){   // reveal Part B
    op = 1 - (t-ARRIVAL_AT)/FADE_DUR;
  }
  fadeEl.style.opacity = op;
}

/* ================================================================
   MAIN LOOP
   ================================================================ */
let playStart = 0;
function tick(now){
  const t = now - playStart;
  updateFade(t);

  if(phase === "A"){
    orchestrateA(t);
    if(t >= ARRIVAL_AT && !arrivalBuilt){ arrivalBuilt = true; enterPartB(); }
  }
  if(phase === "B"){
    orchestrateB(t);
  }
  rafId = requestAnimationFrame(tick);
}

/* ================================================================
   PLAY / REPLAY — rebuilds and restarts the whole A -> B timeline.
   ================================================================ */
function play(){
  if(rafId) cancelAnimationFrame(rafId);
  phase = "A";
  talonsOpened = false;
  arrivalBuilt = false;
  stage.classList.remove("cool");
  captionEl.style.transition = "none";
  captionEl.style.opacity = 0;

  buildScene(ASSETS_A, { motes:false });
  void scene.getBoundingClientRect(); // reflow so CSS animations restart at frame 0
  playStart = performance.now();
  rafId = requestAnimationFrame(tick);
}

document.getElementById("replay").addEventListener("click", play);

/* ---- parallax pointer hook (subtle; expand later for depth) ---- */
window.addEventListener("pointermove", (e)=>{
  const nx = (e.clientX/window.innerWidth  - .5)*2;
  const ny = (e.clientY/window.innerHeight - .5)*2;
  const keys = Object.keys(layerGroups).map(Number).sort((a,b)=>a-b);
  keys.forEach((L,i)=>{
    const depth = (1 - i/Math.max(1,(keys.length-1))) * PARALLAX_MAX;
    const g = layerGroups[L];
    g.style.transition = "transform .5s cubic-bezier(.2,.7,.3,1)";
    g.style.transform  = `translate(${ -nx*depth }px, ${ -ny*depth }px)`;
  });
});

        <path d="M10 6 Q18 28 8 50"/>

      </g>
    </g>`;
  },

  /* pale, bioluminescent-feeling mushroom with a soft glow halo */
  glowMushroom: (o)=>{
    const cap = o.cap==="violet" ? "#C8BEE2" : "#B7E6D2";
    const dot = o.cap==="violet" ? "#EDE7F6" : "#EAFBF1";
    return `
    <circle cx="0" cy="-4" r="34" fill="url(#glowGrad)"/>
    <path d="M-6 46 Q-9 6 0 4 Q9 6 6 46 Z" fill="var(--glow-stem)"/>
    <path d="M-8 45 Q-9 18 0 16 L0 46 Z" fill="#9FC4B5" opacity=".5"/>
    <path d="M-26 6 Q0 -28 26 6 Q0 18 -26 6 Z" fill="${cap}"/>
    <g fill="${dot}">
      <circle cx="-11" cy="-2" r="3.4"/><circle cx="8" cy="-6" r="3"/>
      <circle cx="16" cy="3" r="2.4"/><circle cx="-2" cy="5" r="2.2"/>
    </g>`;
  },

  /* SLUG — shell-less, smooth, fluid. faces right. opts.flip mirrors.
     opts: { body, foot, ridge, eye } */
  slug: (o)=>{
    const body = o.body||"#9FD0BC", foot=o.foot||"#84B7A2", ridge=o.ridge||"#6FA08C", eye=o.eye||"#34463E";
    const flip = o.flip ? `transform="scale(-1,1)"` : "";
    return `
    <g ${flip}>
      <!-- sole -->
      <path d="M-46 30 Q-50 22 -40 22 L42 22 Q50 22 50 29 Q50 36 42 36 L-40 36 Q-46 36 -46 30 Z"
            fill="${foot}"/>
      <!-- smooth shell-less body, rising to a mantle hump then the head -->
      <path d="M-44 26 Q-52 2 -28 -6 Q-4 -14 22 -8 Q50 -2 53 18 Q53 24 49 26 L-40 27 Q-44 27 -44 26 Z"
            fill="${body}"/>
      <!-- subtle mantle ridge -->
      <path d="M-30 -2 Q-6 -9 18 -4" stroke="${ridge}" stroke-width="2.6"
            fill="none" stroke-linecap="round" opacity=".8"/>
      <!-- upper (optical) tentacles -->
      <path d="M44 6 Q40 -16 34 -28" stroke="${body}" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M51 9 Q54 -6 56 -17"  stroke="${body}" stroke-width="4.4" fill="none" stroke-linecap="round"/>
      <circle cx="34" cy="-29" r="4.6" fill="${body}"/>
      <circle cx="56" cy="-18" r="4.2" fill="${body}"/>
      <circle cx="34.4" cy="-30" r="2" fill="${eye}"/>
      <circle cx="56.3" cy="-19" r="1.8" fill="${eye}"/>
      <!-- lower (sensory) tentacles, tiny -->
      <path d="M48 22 q7 4 10 11" stroke="${body}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M43 24 q6 5 8 12"  stroke="${body}" stroke-width="3"   fill="none" stroke-linecap="round"/>
      <!-- translucent sheen -->
      <path d="M-26 -6 Q-8 -16 14 -10" stroke="rgba(255,255,255,.35)"
            stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="-30" cy="14" rx="12" ry="4" fill="rgba(255,255,255,.16)"/>
    </g>`;
  },

  /* a different, cooler leaf than home's — more lanceolate, pointed tip */
  foreignLeaf: ()=>`
    <path d="M-48 8 Q-42 8 -32 4" stroke="var(--fern-mid)" stroke-width="4"
          fill="none" stroke-linecap="round"/>
    <path d="M-34 4 Q-16 -34 24 -26 Q48 -20 50 0 Q49 22 10 32 Q-30 36 -34 4 Z"
          fill="var(--fern-near)"/>
    <path d="M-26 4 Q-8 -24 22 -16 Q40 -10 42 2 Q40 18 8 25 Q-22 26 -26 4 Z"
          fill="#A6CDB6" opacity=".7"/>
    <path d="M-30 4 Q8 0 50 0" stroke="var(--fern-mid)" stroke-width="3"
          fill="none" stroke-linecap="round"/>
    <g stroke="var(--fern-mid)" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M-12 3 Q-6 -12 4 -16"/>
      <path d="M6 2 Q14 -8 26 -10"/>
      <path d="M22 1 Q30 -4 38 -4"/>
      <path d="M-10 4 Q-6 16 2 22"/>
      <path d="M10 3 Q16 14 24 18"/>
    </g>`,
};

/* ----------------- GO ----------------- */
play();
</script>
</body>
</html>
