<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habitat Map</title>
<!-- Lora — warm literary serif for the text blob (loaded from Google Fonts CDN) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #1a2a1a;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* ── Map container ─────────────────────────────────────────────────────── */
#map-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

/* ── Landscape layer ───────────────────────────────────────────────────── */
#landscape-layer {
  position: absolute;
  inset: 0;
}

#landscape-svg {
  width: 100%;
  height: 100%;
  display: block;
}

#landscape-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none; /* shown by JS once the real image loads */
}

/* ── Hotspot layer ─────────────────────────────────────────────────────── */
#hotspots-layer {
  position: absolute;
  inset: 0;
  pointer-events: none; /* layer passthrough; individual hotspots re-enable */
}

/* ── Hotspot marker ────────────────────────────────────────────────────── */
.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: all;
  cursor: pointer;
}

.hotspot-ring {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.65);
  background: rgba(22, 36, 20, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: hs-pulse 2.6s ease-in-out infinite;
  transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

/* Snail portrait inside the ring */
.hotspot-snail {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.18s ease;
}

.hotspot-snail .snail-img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
}

.hotspot-snail-placeholder {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
}

.hotspot-label {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.9);
  text-shadow: 0 1px 5px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.7);
  opacity: 0;
  transition: opacity 0.2s ease, top 0.18s ease;
  pointer-events: none;
}

/* hover & active states */
.hotspot:hover .hotspot-ring,
.hotspot.active .hotspot-ring {
  animation: none;
  border-color: rgba(255, 255, 255, 0.95);
  background: rgba(22, 36, 20, 0.90);
  transform: scale(1.25);
}

.hotspot:hover .hotspot-snail,
.hotspot.active .hotspot-snail {
  transform: scale(1.1);
}

.hotspot:hover .hotspot-label,
.hotspot.active .hotspot-label {
  opacity: 1;
  top: calc(100% + 16px);
}

@keyframes hs-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.3); }
  55%       { box-shadow: 0 0 0 18px rgba(255, 255, 255, 0); }
}

/* ── Popup (storybook illustration) ───────────────────────────────────── */
#popup {
  position: fixed;
  width: 640px;
  height: 520px;
  background: transparent;
  border: none;
  overflow: visible;
  z-index: 200;
  opacity: 0;
  transform: scale(0.9) translateY(12px);
  transition: opacity 0.26s ease, transform 0.26s ease;
  pointer-events: none;
}

#popup.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: all;
  /* Drop-shadows compose on the already-rendered blob shape, so the glow follows the morphed edge */
  filter:
    drop-shadow(0 0 1px rgba(240, 235, 228, 0.88))
    drop-shadow(0 0 12px rgba(235, 228, 215, 0.38));
}

/* The illustration — mask defines the soft circle, filter warps it into a shifting blob */
.popup-image-wrap {
  position: absolute;
  top: 0;
  left: 0;
  width: 480px;
  height: 480px;
  overflow: visible;
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 42%, transparent 68%);
          mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 42%, transparent 68%);
  filter: url(#blob-morph);
}

#popup-img,
#popup-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  will-change: transform;
}

#popup-img-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  background: radial-gradient(ellipse at 50% 40%, #3e5c32 0%, #1a2a1a 100%);
}

.placeholder-icon {
  width: 28px;
  height: 28px;
  opacity: 0.2;
}

.placeholder-label {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.2);
}

/* Text hidden — image is the focus for now */
.popup-body {
  display: none;
}

#popup-label {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 13px;
  font-weight: normal;
  font-style: italic;
  letter-spacing: 0.01em;
  color: rgba(255, 255, 255, 0.92);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 0, 0, 0.6);
  margin-bottom: 6px;
}

#popup-description {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 11px;
  line-height: 1.65;
  color: rgba(255, 255, 255, 0.5);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
}

#popup-fact {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 10.5px;
  line-height: 1.6;
  color: rgba(255, 255, 255, 0.28);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
  margin-top: 8px;
  padding-top: 0;
  border-top: none;
}

/* ── Text blob ─────────────────────────────────────────────────────────── */
/* Wrapper — no filter here so text is never distorted */
#popup-text-blob {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 470px;
  height: 300px;
  overflow: visible;
  opacity: 0;
  transform: scale(0.88) translate(8px, 6px);
  transition: opacity 0.28s ease 0.12s, transform 0.28s ease 0.12s;
  pointer-events: none;
}
#popup-text-blob.visible {
  opacity: 1;
  transform: scale(1) translate(0, 0);
  pointer-events: all;
}

/* This element gets the filter+mask — background only, no text inside */
#popup-text-blob-bg {
  position: absolute;
  inset: 0;
  background: rgba(255, 252, 248, 0.90);
  -webkit-mask-image: radial-gradient(ellipse 82% 76% at 50% 50%, black 60%, transparent 84%);
          mask-image: radial-gradient(ellipse 82% 76% at 50% 50%, black 60%, transparent 84%);
  filter: url(#blob-morph-text);
}

/* Text lives as a sibling above the filtered bg — never filtered, never distorted */
.text-blob-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 46px 68px;
  text-align: center;
  z-index: 1;
}

.text-blob-desc {
  font-family: 'Lora', Georgia, 'Times New Roman', serif;
  font-size: 16px;
  line-height: 1.7;
  color: rgba(28, 24, 18, 0.84);
  font-style: italic;
  margin: 0;
}

</style>
</head>

<!--
  Blob morph filter — three-stage pipeline:
  1. Displace the full source (creates the morphing edge)
  2. Build a center shield: erode the source alpha inward, then blur to soften it
  3. Composite original (undisplaced) back on top in the center only
  Result: edges shift organically, center stays sharp and readable.
-->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blob-morph" x="-40%" y="-40%" width="180%" height="180%"
            color-interpolation-filters="linearRGB">

      <!-- Stage 1: turbulence noise, slowly evolving -->
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.009 0.007"
                    numOctaves="3"
                    seed="2"
                    result="noise">
        <animate attributeName="baseFrequency"
                 values="0.009 0.007; 0.013 0.010; 0.007 0.012; 0.011 0.008; 0.009 0.007"
                 dur="22s" calcMode="linear" repeatCount="indefinite"/>
      </feTurbulence>

      <!-- Stage 2: displace the full source — this warps the edge into a blob -->
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         xChannelSelector="R" yChannelSelector="G"
                         result="displaced">
        <animate attributeName="scale"
                 values="48; 66; 40; 58; 50; 48"
                 dur="14s" calcMode="linear" repeatCount="indefinite"/>
      </feDisplacementMap>

      <!-- Stage 3a: shrink the source alpha inward to isolate the solid center -->
      <feMorphology in="SourceAlpha" operator="erode" radius="55" result="erodedCore"/>
      <!-- Stage 3b: blur to make the shield boundary soft, not hard -->
      <feGaussianBlur in="erodedCore" stdDeviation="28" result="centerShield"/>

      <!-- Stage 3c: cut the original (undisplaced) source to just the center shield -->
      <feComposite in="SourceGraphic" in2="centerShield" operator="in" result="coreImage"/>

      <!-- Final merge: displaced blob underneath, original center on top -->
      <feMerge>
        <feMergeNode in="displaced"/>
        <feMergeNode in="coreImage"/>
      </feMerge>
    </filter>

    <!-- Second filter for the text blob — different seed + timing so they morph independently -->
    <filter id="blob-morph-text" x="-40%" y="-40%" width="180%" height="180%"
            color-interpolation-filters="linearRGB">
      <feTurbulence type="fractalNoise"
                    baseFrequency="0.012 0.009"
                    numOctaves="3"
                    seed="5"
                    result="noise">
        <animate attributeName="baseFrequency"
                 values="0.012 0.009; 0.016 0.012; 0.009 0.014; 0.013 0.010; 0.012 0.009"
                 dur="17s" calcMode="linear" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise"
                         xChannelSelector="R" yChannelSelector="G"
                         result="displaced">
        <animate attributeName="scale"
                 values="32; 44; 26; 38; 34; 32"
                 dur="11s" calcMode="linear" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feMorphology in="SourceAlpha" operator="erode" radius="36" result="erodedCore"/>
      <feGaussianBlur in="erodedCore" stdDeviation="18" result="centerShield"/>
      <feComposite in="SourceGraphic" in2="centerShield" operator="in" result="coreImage"/>
      <feMerge>
        <feMergeNode in="displaced"/>
        <feMergeNode in="coreImage"/>
      </feMerge>
    </filter>
  </defs>
</svg>

<script>
// ── Data ─────────────────────────────────────────────────────────────────
// Everything is hardcoded here — no external JSON, no server needed. This file
// is fully self-contained: open it directly, commit it to Git, or embed it in
// WordPress via an <iframe>.
//
// ASSET_BASE is prepended to every image path. Images live in ./web-assets/,
// committed alongside this file, so they're served same-origin from GitHub
// Pages (and work locally + offline). No external hosting needed.
const ASSET_BASE = 'web-assets/';

const CONFIG = {
  landscape: {
    image: 'snail-background.jpg',
    alt: 'Aerial view of a wooded pond, home to six snail tribes',
  },
  hotspots: [
    {
      id: 'north-rocks',
      label: 'North Shore Rocks — The Mosswhorls',
      tribe: 'Mosswhorls',

// ── State ──────────────────────────────────────────────────────────────────
let pinned    = false;  // click-to-pin: popup stays open when mouse leaves
let hideTimer = null;

// ── Boot ───────────────────────────────────────────────────────────────────
buildMap(CONFIG);

// ── Build ──────────────────────────────────────────────────────────────────
function asset(path) { return path ? ASSET_BASE + path : path; }

function buildMap(cfg) {
  setLandscape(cfg.landscape);
  buildHotspots(cfg.hotspots);
}

function setLandscape(landscape) {
  if (!landscape || !landscape.image) return;
  const img = document.getElementById('landscape-img');
  if (landscape.alt) img.alt = landscape.alt;
  img.onload  = () => { img.style.display = 'block'; };
  img.onerror = () => { /* SVG placeholder stays; real image silently absent */ };
  img.src = asset(landscape.image);
}

function buildHotspots(hotspots) {
  const layer = document.getElementById('hotspots-layer');
  hotspots.forEach(hs => {
    hs.imageOffset    = hs.imageOffset    || { x: 0, y: 0 };
    hs.textBlobOffset = hs.textBlobOffset || { x: 180, y: 240 };
    const el = document.createElement('div');
    el.className   = 'hotspot';
    el.dataset.id  = hs.id;
    el.style.left  = hs.x + '%';
    el.style.top   = hs.y + '%';
    el.innerHTML = `
      <div class="hotspot-ring">
        <div class="hotspot-snail">
          <div class="hotspot-snail-placeholder"></div>
        </div>
      </div>
      <span class="hotspot-label">${escapeHTML(hs.label)}</span>
    `;

    if (hs.snailImage) {
      const wrap = el.querySelector('.hotspot-snail');
      const ph   = wrap.querySelector('.hotspot-snail-placeholder');
      const img  = document.createElement('img');
      img.className   = 'snail-img';
      img.alt         = hs.tribe || '';
      img.style.display = 'none';
      img.onload  = () => { img.style.display = 'block'; ph.style.display = 'none'; };
      img.onerror = () => { img.remove(); ph.style.display = 'flex'; };
      wrap.insertBefore(img, ph);
      img.src = asset(hs.snailImage);
    }
    el.addEventListener('mouseenter', () => { clearHideTimer(); showPopup(hs, el); });
    el.addEventListener('mouseleave', () => { scheduleHide(); });
    el.addEventListener('click',      e  => { e.stopPropagation(); togglePin(hs, el); });
    layer.appendChild(el);
  });
}

// ── Popup ──────────────────────────────────────────────────────────────────
const popup      = document.getElementById('popup');
const popupImg      = document.getElementById('popup-img');
const popupVideo    = document.getElementById('popup-video');
const popupImgPh    = document.getElementById('popup-img-placeholder');
const popupTextBlob = document.getElementById('popup-text-blob');
const popupDescText = document.getElementById('popup-desc-text');
const popupLabel = document.getElementById('popup-label');
const popupDesc  = document.getElementById('popup-description');
const popupFact  = document.getElementById('popup-fact');

// Bridge gap: moving mouse from hotspot to popup cancels hide timer
popup.addEventListener('mouseenter', clearHideTimer);
popup.addEventListener('mouseleave', scheduleHide);

function showPopup(hs, el) {
  clearHideTimer();

  popupLabel.textContent = hs.label;
  popupDesc.textContent  = hs.description || '';
  popupFact.textContent  = hs.fact || '';

  if (hs.video) {
    const src = asset(hs.video);
    popupVideo.style.display  = 'block';
    popupImg.style.display    = 'none';
    popupImgPh.style.display  = 'none';
    if (popupVideo.getAttribute('src') !== src) {
      popupVideo.src = src;
    }
    popupVideo.play().catch(() => {});
  } else if (hs.zoomedImage) {
    popupVideo.style.display  = 'none';
    popupImg.style.display    = 'block';
    popupImgPh.style.display  = 'none';
    popupImg.onerror = () => {
      popupImg.style.display   = 'none';
      popupImgPh.style.display = 'flex';
    };
    popupImg.src = asset(hs.zoomedImage);
  } else {
    popupVideo.style.display  = 'none';
    popupImg.style.display    = 'none';
    popupImgPh.style.display  = 'flex';
  }
  applyImageOffset(hs);

  // Text blob
  popupDescText.textContent = hs.description || '';
  applyTextBlobOffset(hs);   // this hotspot's own position, re-synced on every open
  popupTextBlob.classList.add('visible');

  positionPopup(el);

  document.querySelectorAll('.hotspot.active').forEach(h => h.classList.remove('active'));
  el.classList.add('active');
  popup.classList.add('visible');
}

function positionPopup(hotspotEl) {
  const POPUP_W  = 640;
  const POPUP_H  = 520;
  const GAP      = 16;
  const MARGIN   = 10;

  const r  = hotspotEl.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const cx = r.left + r.width  / 2;
  const cy = r.top  + r.height / 2;

  // Prefer right side; fall back to left if too close to right edge
  let left = cx < vw / 2
    ? r.right  + GAP
    : r.left   - POPUP_W - GAP;

  // Prefer aligning top to hotspot top; fall back to bottom-align if low on screen
  let top = cy < vh / 2
    ? r.top
    : r.bottom - POPUP_H;

  // Clamp to viewport margins
  left = Math.max(MARGIN, Math.min(left, vw - POPUP_W - MARGIN));
  top  = Math.max(MARGIN, Math.min(top,  vh - POPUP_H - MARGIN));

  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';
}

function hidePopup() {
  popupVideo.pause();
  popupVideo.currentTime = 0;
  popup.classList.remove('visible');
  popupTextBlob.classList.remove('visible');
  document.querySelectorAll('.hotspot.active').forEach(h => h.classList.remove('active'));
  pinned = false;
}

function scheduleHide() {
  if (pinned) return;
  hideTimer = setTimeout(hidePopup, 280);
}

function clearHideTimer() {
  clearTimeout(hideTimer);
  hideTimer = null;
}

function togglePin(hs, el) {
  if (pinned && el.classList.contains('active')) {
    // already pinned on this hotspot — unpin and close
    pinned = false;
    hidePopup();
  } else {
    pinned = true;
    showPopup(hs, el);
  }
}

// ── Global dismiss ─────────────────────────────────────────────────────────
document.getElementById('map-container').addEventListener('click', e => {
  if (!e.target.closest('.hotspot') && !e.target.closest('#popup')) {
    pinned = false;
    hidePopup();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { pinned = false; hidePopup(); }
});

// ── Util ───────────────────────────────────────────────────────────────────
function escapeHTML(str) {
  return str.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── Popup positioning helpers ───────────────────────────────────────────────
// Text blob and image framing offsets are baked into CONFIG per hotspot and
// applied on every open. (They were tuned in the now-removed edit mode.)
function applyTextBlobOffset(hs) {
  const off = (hs && hs.textBlobOffset) ? hs.textBlobOffset : null;
  if (!off) return;
  popupTextBlob.style.left   = off.x + 'px';
  popupTextBlob.style.top    = off.y + 'px';
  popupTextBlob.style.right  = 'auto';
  popupTextBlob.style.bottom = 'auto';
}

function applyImageOffset(hs) {
  const off = (hs && hs.imageOffset) ? hs.imageOffset : { x: 0, y: 0 };
  const t   = `translate(${off.x}px, ${off.y}px)`;
  popupImg.style.transform   = t;
  popupVideo.style.transform = t;
}
</script>
